; mousefix.ini - mouse fix for Worms Ultimate Mayhem
; Changes take effect after restarting the game.

[MouseFix]
; OneToOne=1: the cursor moves exactly like your Windows mouse (1 mouse step = 1 pixel).
;   Menus feel like Windows; in matches the game's own mouse sensitivity is applied on top.
;   NOTE: this is slower than the original game at high resolutions (3x slower at 1080p),
;   because the original moved in 640x480 steps. Raise the in-game sensitivity for faster matches.
; OneToOne=0: original game speed (keeps old muscle memory, but coarse 640x480 steps).
OneToOne=1

; Speed multiplier on top of the above. 1.0 = no change.
Speed=1.0

; Fixes (1 = on, 0 = off)
FixScale=1          ; master switch for the speed/precision fixes
KeepReference=1     ; no lost/backward steps when the game re-reads the cursor
SmoothCursor=1      ; menu cursor drawn every frame instead of every 20 ms
MatchSensitivity=1  ; apply Speed/OneToOne to the in-match cursor too
FixRecenter=1       ; no backward jumps while aiming in matches

; Diagnostics: 0 = off, 1 = summary log, 2 = every mouse movement (big file, tests only).
; The log is written to mousefix.log in the game folder.
Log=0
